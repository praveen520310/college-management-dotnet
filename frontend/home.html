<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>College Management System</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="page">

    <!-- HEADER -->

    <div class="header-card">

        <div class="header-left">

            <div class="title-row">

                <span class="graduation-icon">🎓</span>

                <h1>
                    College Management System
                </h1>

            </div>

            <p>
                Student Registration &amp; Management Portal
            </p>

        </div>


        <div class="header-right">

            <p id="userInfo">
                Loading user information...
            </p>

            <span class="role-badge">
                ADMIN
            </span>

        </div>

    </div>


    <!-- STUDENT REGISTRATION -->

    <div class="card">

        <h2>
            Student Registration
        </h2>


        <form id="studentForm">

            <!-- FULL NAME -->

            <div class="form-group">

                <label for="studentName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter student name"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="studentEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="studentEmail"
                    placeholder="Enter email address"
                    required>

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Phone
                </label>

                <input
                    type="text"
                    id="phone"
                    placeholder="Enter phone number"
                    required>

            </div>


            <!-- DATE OF BIRTH -->

            <div class="form-group">

                <label for="dateOfBirth">
                    Date of Birth
                </label>

                <input
                    type="date"
                    id="dateOfBirth"
                    required>

            </div>


            <!-- GENDER -->

            <div class="form-group">

                <label for="gender">
                    Gender
                </label>

                <select
                    id="gender"
                    required>

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- DEPARTMENT -->

            <div class="form-group">

                <label for="departmentId">
                    Department
                </label>

                <select
                    id="departmentId"
                    required>

                    <option value="">
                        Loading departments...
                    </option>

                </select>

            </div>


            <!-- COURSE -->

            <div class="form-group">

                <label for="courseId">
                    Course
                </label>

                <select
                    id="courseId"
                    required>

                    <option value="">
                        Loading courses...
                    </option>

                </select>

            </div>


            <!-- YEAR -->

            <div class="form-group">

                <label for="year">
                    Year
                </label>

                <select
                    id="year"
                    required>

                    <option value="">
                        Select Year
                    </option>

                    <option value="1">
                        1
                    </option>

                    <option value="2">
                        2
                    </option>

                    <option value="3">
                        3
                    </option>

                    <option value="4">
                        4
                    </option>

                </select>

            </div>


            <!-- SEMESTER -->

            <div class="form-group">

                <label for="semester">
                    Semester
                </label>

                <select
                    id="semester"
                    required>

                    <option value="">
                        Select Semester
                    </option>

                    <option value="1">
                        1
                    </option>

                    <option value="2">
                        2
                    </option>

                </select>

            </div>


            <!-- ADDRESS -->

            <div class="form-group full-width">

                <label for="address">
                    Address
                </label>

                <textarea
                    id="address"
                    placeholder="Enter student address"
                    required></textarea>

            </div>


            <!-- BUTTON -->

            <div class="form-actions">

                <button
                    type="submit">

                    Register Student

                </button>

            </div>

        </form>


        <p id="message"></p>

    </div>


    <!-- STUDENT MANAGEMENT -->

    <div class="card management-card">

        <h2>
            Student Management
        </h2>

        <button
            type="button"
            onclick="loadStudents()">

            View Students

        </button>

        <div id="studentsList"></div>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
